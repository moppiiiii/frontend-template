name: PR Check

on:
  pull_request:
  push:
    branches: ["main"]

# 同一 PR / ブランチで新しい push が来たら古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type / Lint / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # bun のバージョンは .bun-version から自動検出される

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (tsgo + oxlint + oxfmt)
        run: bun run check

      - name: Test (vitest)
        run: bun run test

      - name: Build (vite)
        run: bun run build
        env:
          # ビルド検証用のダミー値（env.ts の実行時バリデーションを通すため）
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy
